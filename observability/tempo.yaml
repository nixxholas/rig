server:
    http_listen_port: 3200
distributor:
    receivers:
        otlp:
            protocols:
                http:
                    endpoint: 0.0.0.0:4318
ingester:
    max_block_duration: 5m
compactor:
    compaction:
        block_retention: 1h
storage:
    trace:
        backend: local
        local:
            path: /var/lib/tempo/blocks
        wal:
            path: /var/lib/tempo/wal
