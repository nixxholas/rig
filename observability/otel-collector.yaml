receivers:
    otlp:
        protocols:
            http:
                endpoint: 0.0.0.0:4318
exporters:
    otlphttp/tempo:
        endpoint: http://tempo:4318
processors:
    batch:
service:
    pipelines:
        traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/tempo]
