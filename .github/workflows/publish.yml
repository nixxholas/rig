name: Publish package

on:
    push:
        branches:
            - main
        tags:
            - "v*"
            - "rig-connect-v*"
            - "happy-plugins-v*"
    workflow_dispatch:

env:
    RELEASE_PACKAGE: ${{ startsWith(github.ref_name, 'rig-connect-v') && 'rig-connect' || startsWith(github.ref_name, 'happy-plugins-v') && 'happy-plugins' || 'rig' }}

permissions:
    contents: read
    id-token: write

concurrency:
    group: publish-${{ github.ref }}
    # Only the newest canary build of main is worth finishing.
    cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
    publish:
        name: Publish selected package
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        environment: npm
        timeout-minutes: 30

        steps:
            - name: Check out the release tag
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install Linux sandbox dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes bubblewrap ripgrep socat
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi

            - name: Verify the tagged commit is on main
              run: |
                  if ! git merge-base --is-ancestor HEAD origin/main; then
                      echo "Release tags must point to a commit on the main branch." >&2
                      exit 1
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify the tag matches the package version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: pnpm exec tsx scripts/validateReleaseTag.ts

            - name: Run type checks
              run: pnpm run check

            - name: Run tests
              env:
                  # Keep Sandbox Runtime's home-directory mask away from the checkout.
                  HOME: ${{ runner.temp }}/rig-test-home
              run: |
                  mkdir -p "$HOME"
                  pnpm run test:scripts
                  pnpm --recursive --filter './packages/**' --filter '!@slopus/rig-dev' run test

            - name: Build the package
              run: |
                  case "$RELEASE_PACKAGE" in
                      rig-connect) pnpm --filter @slopus/rig-connect build ;;
                      happy-plugins) pnpm --filter happy-plugins build ;;
                      *) pnpm run build ;;
                  esac

            - name: Publish the package
              run: pnpm exec tsx scripts/publishPackage.ts

    canary:
        name: Publish the canary builds
        if: github.ref == 'refs/heads/main' && github.repository == 'slopus/rig'
        runs-on: ubuntu-latest
        environment: npm
        timeout-minutes: 20

        steps:
            - name: Check out the commit
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install Linux sandbox dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes bubblewrap ripgrep socat
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # A resolvable published side-package canary is its watermark, keeping later package
            # changes pending across failed workflows.
            - name: Check for unpublished side-package changes
              id: changed
              env:
                  PUSHED_FROM: ${{ github.event.before }}
              run: pnpm exec tsx scripts/detectCanaryPackageChanges.ts

            - name: Set the canary versions
              env:
                  CANARY_BUILD_NUMBER: ${{ github.run_number }}
                  CANARY_COMMIT: ${{ github.sha }}
                  CONNECT_CHANGED: ${{ steps.changed.outputs.connect }}
                  PLUGINS_CHANGED: ${{ steps.changed.outputs.plugins }}
              run: |
                  # happy-plugins is versioned before the build so the SDK Rig bundles carries the
                  # same canary version that is published.
                  if [[ "$PLUGINS_CHANGED" == "true" ]]; then
                      RELEASE_PACKAGE=happy-plugins pnpm exec tsx scripts/setCanaryVersion.ts
                  fi
                  RELEASE_PACKAGE=rig pnpm exec tsx scripts/setCanaryVersion.ts
                  if [[ "$CONNECT_CHANGED" == "true" ]]; then
                      RELEASE_PACKAGE=rig-connect pnpm exec tsx scripts/setCanaryVersion.ts
                  fi

            - name: Build the packages
              env:
                  CONNECT_CHANGED: ${{ steps.changed.outputs.connect }}
              run: |
                  pnpm run build
                  if [[ "$CONNECT_CHANGED" == "true" ]]; then
                      pnpm --filter @slopus/rig-connect build
                  fi

            # Canary builds stay fast: unit tests only, no gym, Docker, or live-provider suites.
            - name: Run unit tests
              env:
                  # Keep Sandbox Runtime's home-directory mask away from the checkout.
                  HOME: ${{ runner.temp }}/rig-test-home
              run: |
                  mkdir -p "$HOME"
                  pnpm run test:scripts
                  pnpm --recursive --filter './packages/**' --filter '!@slopus/rig-dev' --filter '!@slopus/rig-gym-tests' run test

            - name: Publish the canary builds
              env:
                  CONNECT_CHANGED: ${{ steps.changed.outputs.connect }}
                  PLUGINS_CHANGED: ${{ steps.changed.outputs.plugins }}
                  RELEASE_DIST_TAG: canary
              run: |
                  if [[ "$PLUGINS_CHANGED" == "true" ]]; then
                      RELEASE_PACKAGE=happy-plugins pnpm exec tsx scripts/publishPackage.ts
                  fi
                  RELEASE_PACKAGE=rig pnpm exec tsx scripts/publishPackage.ts
                  if [[ "$CONNECT_CHANGED" == "true" ]]; then
                      RELEASE_PACKAGE=rig-connect pnpm exec tsx scripts/publishPackage.ts
                  fi
