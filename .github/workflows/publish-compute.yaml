name: Publish happy-agent-compute

# happy-agent-compute is the only package whose correctness is an operating-system claim: Seatbelt
# on macOS and Bubblewrap on Linux enforce the boundary, not TypeScript. A release therefore has to
# prove the sandbox actually holds on both platforms before anything reaches npm, which is why this
# package releases on its own workflow instead of the shared ubuntu-only one.

on:
    push:
        tags:
            - "happy-agent-compute-v*"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: publish-compute-${{ github.ref }}
    cancel-in-progress: false

jobs:
    sandbox:
        name: Sandbox on ${{ matrix.name }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            # Both platforms report, so a one-platform sandbox regression is visible as exactly that.
            fail-fast: false
            matrix:
                include:
                    - name: macOS (Seatbelt)
                      runner: macos-15
                      docker: false
                    - name: Linux (Bubblewrap)
                      runner: ubuntu-24.04
                      docker: true

        steps:
            - name: Check out the release
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install Linux sandbox dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes bubblewrap socat
                  # Bubblewrap needs unprivileged user namespaces, which Ubuntu confines by default.
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run type checks
              run: pnpm --filter @slopus/happy-agent-compute check

            - name: Run unit tests
              env:
                  # Keep Sandbox Runtime's home-directory mask away from the checkout.
                  HOME: ${{ runner.temp }}/rig-test-home
                  # Refuse to let an unspawnable sandbox report the boundary cases as passing.
                  HAPPY_AGENT_COMPUTE_REQUIRE_SANDBOX: "1"
              run: |
                  mkdir -p "$HOME"
                  pnpm --filter @slopus/happy-agent-compute test

            - name: Prove the host sandbox boundary
              run: pnpm --filter @slopus/happy-agent-compute test:live:host

            - name: Prove the just-bash permission boundary
              run: pnpm --filter @slopus/happy-agent-compute test:live:just-bash

            - name: Prove the container boundary
              # GitHub's macOS runners have no Docker daemon, so the container backend is proven on
              # Linux only.
              if: matrix.docker
              run: pnpm --filter @slopus/happy-agent-compute test:live:docker

    publish:
        name: Publish @slopus/happy-agent-compute
        if: startsWith(github.ref, 'refs/tags/happy-agent-compute-v')
        needs: sandbox
        runs-on: ubuntu-24.04
        environment: npm
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write
        env:
            RELEASE_PACKAGE: happy-agent-compute
            RELEASE_DIST_TAG: ${{ contains(github.ref_name, '-beta.') && 'beta' || '' }}

        steps:
            - name: Check out the release tag
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Verify the tagged commit is on main
              run: |
                  if ! git merge-base --is-ancestor HEAD origin/main; then
                      echo "Release tags must point to a commit on the main branch." >&2
                      exit 1
                  fi

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify the tag matches the package version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: pnpm exec tsx scripts/validateReleaseTag.ts

            - name: Build the package
              run: pnpm --filter @slopus/happy-agent-compute build

            - name: Publish the package
              run: pnpm exec tsx scripts/publishPackage.ts
