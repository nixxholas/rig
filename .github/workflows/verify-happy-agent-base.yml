name: Verify happy-agent-base

on:
    pull_request:
        paths:
            - ".github/workflows/verify-happy-agent-base.yml"
            - "packages/happy-agent-base/**"
            - "packages/happy-providers/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    push:
        branches:
            - main
        paths:
            - ".github/workflows/verify-happy-agent-base.yml"
            - "packages/happy-agent-base/**"
            - "packages/happy-providers/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verify-happy-agent-base-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: ${{ matrix.database }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                database:
                    - sqlite
                    - pglite
                    - postgres

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: happy_agent_base
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d happy_agent_base"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12

        env:
            HAPPY_AGENT_BASE_TEST_DATABASE: ${{ matrix.database }}
            HAPPY_AGENT_BASE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/happy_agent_base
            NODE_OPTIONS: --max-old-space-size=6144

        steps:
            - name: Check out the repository
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run type checks
              run: pnpm --filter @slopus/happy-agent-base check

            - name: Run the full test suite
              run: pnpm --filter @slopus/happy-agent-base test

            - name: Build the package
              run: pnpm --filter @slopus/happy-agent-base build
